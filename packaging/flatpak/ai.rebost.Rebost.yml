# Rebost for Flathub, built from source with no network access.
#
#   packaging/flatpak/generate-sources.sh       # cargo-sources.json, node-sources.json
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     build-dir packaging/flatpak/ai.rebost.Rebost.yml
#
# Here the app is built from this checkout (`type: dir`). The copy in the
# flathub/ai.rebost.Rebost repository builds a release tag instead;
# packaging/flatpak/flathub.sh writes it. See packaging/flatpak/README.md.
#
# The app ID is the reverse of rebost.ai. Inside the app the Tauri identifier
# stays io.rebost.desktop, so its data lives in
# ~/.var/app/ai.rebost.Rebost/data/io.rebost.desktop.

id: ai.rebost.Rebost
# WebKitGTK 4.1 (what Tauri 2 links) ships in the GNOME runtime, not in the
# Freedesktop one. GNOME 51 is on Freedesktop SDK 26.08, whose SDK has glslc
# (shaderc) for llama.cpp's Vulkan shaders.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: rebost

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Vulkan for the AI, and WebKitGTK's GPU rendering.
  - --device=dri
  # Downloading an AI (Hugging Face), and web lookups when they are turned on.
  - --share=network
  # A Shelf is a folder Rebost reads and keeps watching for new and changed
  # files. Folders opened through the document portal arrive as FUSE paths
  # with no inotify events, so a linked folder would never update. The
  # folder chosen for AIs is written to, and it is often on another drive.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin

modules:
  # llama.cpp at the release Rebost pins (src-tauri/src/engine/pin.rs), with
  # the Vulkan and CPU backends as loadable modules and CPU variants for older
  # and newer processors, like the upstream Linux builds. The app unpacks an
  # archive named like the upstream one, so the same code finds it: the
  # Vulkan build, and the same files without Vulkan as the CPU fallback.
  - name: llama-cpp
    buildsystem: simple
    build-commands:
      - |
        set -eu
        case "$FLATPAK_ARCH" in
          x86_64) suffix=x64 ;;
          aarch64) suffix=arm64 ;;
          *) echo "no llama.cpp build for $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_RPATH='$ORIGIN' \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DGGML_NATIVE=OFF \
          -DGGML_BACKEND_DL=ON \
          -DGGML_CPU_ALL_VARIANTS=ON \
          -DGGML_VULKAN=ON \
          -DLLAMA_CURL=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_SERVER=ON
        cmake --build build -j "$FLATPAK_BUILDER_N_JOBS"
        ls -l build/bin
        stage="$PWD/stage/build/bin"
        mkdir -p "$stage"
        cp -P build/bin/llama-server build/bin/*.so* "$stage/"
        dest=/app/lib/Rebost/resources/engine
        mkdir -p "$dest"
        tar -czf "$dest/llama-b11669-bin-ubuntu-vulkan-$suffix.tar.gz" -C stage build
        rm "$stage"/libggml-vulkan.so*
        tar -czf "$dest/llama-b11669-bin-ubuntu-$suffix.tar.gz" -C stage build
    sources:
      - type: git
        url: https://github.com/ggml-org/llama.cpp.git
        tag: b11669
        commit: 620d2225cc436ab0b001e3200e590e3b286ef9ab

  - name: rebost
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/rebost/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/rebost/flatpak-node/cache
        npm_config_offline: 'true'
    build-commands:
      # Tesseract and Leptonica are compiled by xberg's build script from the
      # verified archives below instead of downloading them.
      - |
        set -eu
        export TESSERACT_RS_CACHE_DIR="$PWD/tesseract-cache"
        export PATH="$PWD/pnpm-bin:$PATH"
        pnpm install --offline --frozen-lockfile --trust-lockfile
        pnpm build
        # From src-tauri, so its .cargo/config.toml applies (GNU ld on x86_64).
        # Rust 1.99 is the project's pin; the Rust extension is on 1.98 for
        # now, which builds this release. Drop the flag once it updates.
        (cd src-tauri && cargo build --release --locked --offline --ignore-rust-version \
          --features tauri/custom-protocol)
      - install -Dm755 src-tauri/target/release/rebost /app/bin/rebost
      - install -Dm644 -t /app/lib/Rebost/resources/tessdata src-tauri/resources/tessdata/*.traineddata src-tauri/resources/tessdata/LICENSE
      - install -Dm644 packaging/flatpak/ai.rebost.Rebost.desktop /app/share/applications/ai.rebost.Rebost.desktop
      - install -Dm644 packaging/flatpak/ai.rebost.Rebost.metainfo.xml /app/share/metainfo/ai.rebost.Rebost.metainfo.xml
      - |
        for size in 32 128 256; do
          install -Dm644 "src-tauri/icons/${size}x${size}.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/ai.rebost.Rebost.png"
        done
      - install -Dm644 LICENSE /app/share/licenses/ai.rebost.Rebost/LICENSE
    sources:
      # rebost-source-begin
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - dist
          - flatpak-build
          - flatpak_app
          - node_modules
          - repo
          - src-tauri/target
          - src-tauri/resources/engine-cache
      # rebost-source-end
      - cargo-sources.json
      - node-sources.json
      # pnpm itself, as the native build pnpm publishes (packageManager in package.json).
      - type: archive
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.15.0.tgz
        sha256: 402f7045b1e0587acb1542f18d38afbccb6babf3c7451394e6fb3d9f0160c6ca
        dest: pnpm-bin
      - type: archive
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.15.0.tgz
        sha256: 8117d65f28e627e949d5fc65d63342266326826a56fa374317bf13fe1166a50e
        dest: pnpm-bin
      # The sources xberg-tesseract 1.3.10 pins (its build.rs), in the layout
      # of its artifact cache: <cache>/source-artifacts/<key>/<sha256>/<name>.
      - type: file
        url: https://codeload.github.com/DanBloomberg/leptonica/zip/13275a278eb55b5746e33f95fbf5a2c8f604b3ab
        sha256: 0febcd4fc5cdc9c52d59509b45483d107f9f40922899e3f134ea615094ecbc77
        dest: tesseract-cache/source-artifacts/leptonica-source/0febcd4fc5cdc9c52d59509b45483d107f9f40922899e3f134ea615094ecbc77
        dest-filename: leptonica.zip
      - type: file
        url: https://codeload.github.com/tesseract-ocr/tesseract/zip/db0ec62f81b0737fbbe184d8fea40af5738f8eef
        sha256: d2470cc33ee34deeae6fc47809d0b33a3623a4343d92ff317ac3b9903c507bad
        dest: tesseract-cache/source-artifacts/tesseract-source/d2470cc33ee34deeae6fc47809d0b33a3623a4343d92ff317ac3b9903c507bad
        dest-filename: tesseract.zip
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
        dest: tesseract-cache/source-artifacts/tessdata-fast-eng/7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
        dest-filename: eng.traineddata
