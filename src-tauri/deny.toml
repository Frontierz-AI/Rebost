# Keep ignore IDs in sync with src-tauri/.cargo/audit.toml (cargo-audit).

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive GTK/unic/paste from Tauri/xberg; we cannot patch them here.
unmaintained = "workspace"
unsound = "workspace"
# zip < 9 `extract()` follows symlinks and keeps SUID/SGID bits. Rebost unpacks with
# zip 9; zip 8 remains only in xberg, calamine (pinned ^0.36 by xberg) and the
# xberg-tesseract build script, which read entries and never call `extract()`.
# Drop these once xberg moves to calamine 0.37.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8 left only in xberg/calamine readers; no extract()" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 left only in xberg/calamine readers; no extract()" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 left only in xberg/calamine readers; no extract()" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
