version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      tokio:
        patterns:
          - "tokio"
          - "tokio-*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      svelte-vite:
        patterns:
          - "vite"
          - "@sveltejs/*"
          - "svelte"
          - "svelte-check"
          - "@tailwindcss/*"
          - "tailwindcss"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
