name: Bug
description: Something in Rebost is wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.8.5 / git SHA / tauri dev"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and hardware
      placeholder: "macOS 15.x M4 24 GB / Windows 11 x64 32 GB"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Installed AI (if relevant)
      placeholder: e.g. Gemma 4 12B
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Diagnostics. Redact document text.
      render: text
  - type: checkboxes
    id: repro
    attributes:
      label: Checks
      options:
        - label: I reproduced this on a current `main` build
        - label: This is not a complaint about answer quality
