name: Release Windows

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  engine-arm64:
    name: Sign ARM64 engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # Current LTS. artifact-signing-cli wants .NET 8 or newer.
          dotnet-version: "10.0.404"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Install artifact-signing-cli
        run: cargo install --locked --version 0.12.0 artifact-signing-cli
      - name: Stage the ARM64 engine
        run: node scripts/fetch-engine.mjs --triple=aarch64-pc-windows-msvc
      - name: Sign llama-server.exe and DLLs
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          Get-ChildItem src-tauri/resources/engine/*.zip | ForEach-Object {
            ./scripts/sign-engine-windows.ps1 -Archive $_.FullName
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-arm64-signed
          path: src-tauri/resources/engine/*.zip
          if-no-files-found: error

  nsis:
    name: NSIS (${{ matrix.label }})
    needs: [engine-arm64]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rebost-windows-x64
          - label: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: rebost-windows-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # Current LTS. artifact-signing-cli wants .NET 8 or newer.
          dotnet-version: "10.0.404"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: windows-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Install artifact-signing-cli
        run: cargo install --locked --version 0.12.0 artifact-signing-cli
      - name: x64 signing tools on Windows on Arm
        # Tauri signs rebost.exe and the uninstaller inside the installer, so
        # ARM64 must sign here. Smart App Control blocks an unsigned rebost.exe.
        if: ${{ matrix.label == 'ARM64' }}
        run: ./scripts/setup-windows-arm-signing.ps1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ matrix.label == 'ARM64' }}
        with:
          name: engine-arm64-signed
          path: engine-signed
      - name: NSIS
        env:
          REBOST_SIGNED_ENGINE_DIR: ${{ matrix.label == 'ARM64' && format('{0}/engine-signed', github.workspace) || '' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -File scripts/release-windows.ps1 -Target ${{ matrix.target }}
      - name: Download and run the signed CUDA engine using the app's installer
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target ${{ matrix.target }} --lib engine::binary::tests::windows_cuda_download_and_launch -- --exact --ignored
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/updater/*.json
          if-no-files-found: error

  universal:
    name: Universal installer
    runs-on: windows-latest
    needs: [nsis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # Current LTS. artifact-signing-cli wants .NET 8 or newer.
          dotnet-version: "10.0.404"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - run: pnpm install --frozen-lockfile
      - name: Install artifact-signing-cli
        run: cargo install --locked --version 0.12.0 artifact-signing-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rebost-windows-arm64
          path: arm-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rebost-windows-x64
          path: x64-in
      - name: Install NSIS for the universal installer
        run: choco install nsis --version=3.12.0 --yes --no-progress
      - name: Build the universal Windows installer
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $x64 = @(Get-ChildItem x64-in -Recurse -Filter *.exe)
          $arm = @(Get-ChildItem arm-in -Recurse -Filter *.exe)
          if ($x64.Count -ne 1 -or $arm.Count -ne 1) { throw "Expected one installer per architecture" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/build-windows-universal.ps1 -X64 $x64[0].FullName -Arm64 $arm[0].FullName -Output "$PWD/Rebost-$version-Windows.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rebost-windows-universal
          path: Rebost-*-Windows.exe
          if-no-files-found: error

  smoke:
    name: Install universal package (${{ matrix.runner }})
    needs: universal
    strategy:
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rebost-windows-universal
          path: download
      - name: Install and check the native executable and bundled engines
        shell: pwsh
        run: |
          $setup = (Get-ChildItem download -Filter *.exe).FullName
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Invalid installer signature' }
          $dir = Join-Path $env:RUNNER_TEMP 'Rebost smoke'
          $run = Start-Process $setup -ArgumentList "/S /D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Installer exited $($run.ExitCode)" }
          $exe = Join-Path $dir 'rebost.exe'
          # Smart App Control blocks unsigned executables and libraries.
          $unsigned = @(Get-ChildItem $dir -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          if ($unsigned) { throw "Not signed: $($unsigned.FullName -join ', ')" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $header = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $header + 4)
          $expected = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expected) { throw "Got PE machine $machine, expected $expected" }
          if ((Get-Item $setup).Length -gt 220000000) { throw 'Universal installer exceeds 220 MB' }
          $archives = @(Get-ChildItem $dir -Recurse -Filter '*.zip')
          if ($archives | Where-Object Name -like '*-cuda-*') { throw 'CUDA unexpectedly bundled' }
          $engine = if ($expected -eq 0xaa64) { '*opencl-adreno-arm64.zip' } else { '*vulkan-x64.zip' }
          if (-not ($archives | Where-Object Name -like $engine)) { throw "Missing $engine" }
          if (-not ($archives | Where-Object Name -like '*cpu-*.zip')) { throw 'Missing CPU fallback' }
