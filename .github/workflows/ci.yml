name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-engine.mjs --dry-run
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - name: Audit production dependencies locally against OSV
        run: |
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o "$scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $scanner" | sha256sum -c -
          chmod +x "$scanner"
          sbom="$RUNNER_TEMP/rebost.cdx.json"
          pnpm sbom --lockfile-only --prod --sbom-format cyclonedx --sbom-spec-version 1.6 --out "$sbom"
          "$scanner" scan source --offline --download-offline-databases --lockfile "$sbom"

  rust_paths:
    name: Rust paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - "locales/**"
              - ".github/workflows/ci.yml"

  rust:
    name: Rust
    needs: rust_paths
    if: needs.rust_paths.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Scratch on /mnt: the workspace disk fills compiling this crate (debug
      # cdylib + static Tesseract). Do not add a large swapfile on that disk.
      CARGO_TARGET_DIR: /mnt/rebost-target
      TMPDIR: /mnt/rebost-tmp
      TESSERACT_RS_CACHE_DIR: /mnt/xberg-tesseract-cache
      CARGO_INCREMENTAL: "0"
      CFLAGS: "-g0"
      CXXFLAGS: "-g0"
      # Full debug + static Tesseract + WebKitGTK is too big for rust-lld on
      # a 7 GB runner (SIGBUS at link). Line tables keep test traces useful.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Cargo ignores target rustflags in config.toml when RUSTFLAGS is set
      # (or when the config is not picked up). Set both flags here so CI never
      # invokes rust-lld. `-fuse-ld=bfd` is passed last and wins.
      RUSTFLAGS: "-C linker-features=-lld -C link-arg=-fuse-ld=bfd"
    steps:
      - name: Free disk and prepare /mnt scratch
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell
          sudo mkdir -p /mnt/rebost-target /mnt/rebost-tmp /mnt/xberg-tesseract-cache
          sudo chown -R "$(id -u):$(id -g)" /mnt/rebost-target /mnt/rebost-tmp /mnt/xberg-tesseract-cache
          df -h
          df -h /mnt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Tauri needs WebKitGTK headers to compile on Ubuntu. Tesseract needs a
      # C++ toolchain and CMake. Linux packages build in release-linux.yml.
      - name: Install Ubuntu libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-directories: /mnt/xberg-tesseract-cache
      - name: Reset incomplete Tesseract sources
        run: |
          set -euo pipefail
          cache="${TESSERACT_RS_CACHE_DIR}"
          for lib in leptonica tesseract; do
            if [[ -d "${cache}/third_party/${lib}" && ! -f "${cache}/third_party/${lib}/CMakeLists.txt" ]]; then
              echo "Incomplete ${lib} source cache; removing ${cache}"
              rm -rf "${cache}"
              mkdir -p "${cache}"
              break
            fi
          done
          rm -rf src-tauri/target/xberg-tesseract-cache
      - name: Verify llama.cpp pins still exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          text = pathlib.Path("src-tauri/src/engine/pin.rs").read_text()
          urls = sorted(set(re.findall(
              r'url: "(https://github.com/ggml-org/llama.cpp/releases/download/[^"]+\.(?:tar\.gz|zip))"',
              text,
          )))
          if not urls:
              sys.exit("no engine pin URLs in pin.rs")
          for url in urls:
              result = subprocess.run(
                  [
                      "curl", "-sI", "-o", "/dev/null", "-w", "%{http_code}",
                      "-L", "--retry", "5", "--retry-all-errors", "--max-time", "60",
                      url,
                  ],
                  capture_output=True,
                  text=True,
              )
              code = result.stdout.strip()
              print(f"{code} {url}")
              if result.returncode != 0 or code != "200":
                  sys.exit(
                      f"pin URL returned {code or result.returncode}: {url}\n{result.stderr}"
                  )
          PY
      - run: cargo fmt --check
        working-directory: src-tauri
      # The runner's disk is too small for the desktop cdylib/staticlib and
      # integration tests here; those stay on `just test`, the macOS/Windows
      # desktop-quality jobs, and release-linux.yml.
      - name: Clippy (lib + unit tests, rlib)
        working-directory: src-tauri
        run: cargo clippy --lib --tests --config 'lib.crate-type=["rlib"]' -- -D warnings
      - name: Test (lib, rlib)
        working-directory: src-tauri
        run: cargo test --lib --config 'lib.crate-type=["rlib"]'

  desktop_quality:
    name: Desktop quality (${{ matrix.os }})
    needs: rust_paths
    if: needs.rust_paths.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/xberg-tesseract-cache
      - name: Reset incomplete Tesseract sources
        shell: bash
        run: |
          set -euo pipefail
          cache="src-tauri/target/xberg-tesseract-cache"
          for lib in leptonica tesseract; do
            if [[ -d "${cache}/third_party/${lib}" && ! -f "${cache}/third_party/${lib}/CMakeLists.txt" ]]; then
              echo "Incomplete ${lib} source cache; removing ${cache}"
              rm -rf "${cache}"
              break
            fi
          done
      - name: Unit and integration quality checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny
      - run: cargo deny check
        working-directory: src-tauri
